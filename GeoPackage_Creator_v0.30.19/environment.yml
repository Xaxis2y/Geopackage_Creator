name: geopackage
# Conda environment for GeoPackage Creator v0.30.19
#
# Create it with:
#     conda env create -f environment.yml
# or just run Anaconda_Start.bat / dev_tools\run_release_check_v0.30.18.bat,
# either of which creates it automatically.
#
# GDAL is the only hard runtime requirement besides lxml; pyproj and reportlab
# are optional (pyproj = preferred WKT2 source with a GDAL fallback, reportlab =
# PDF reports with an HTML fallback). pytest is included so the test suite and
# dev_tools\run_release_check_v0.30.18.py can run in this environment.
#
# v0.30.14: gdal is now PINNED (gdal=3.13.2) instead of just commented as
# recommended. Every OTHER file documenting the GDAL requirement -
# DEPENDENCIES.txt, requirements.txt, INSTALLATION_GUIDE.md,
# install_dependencies.bat/.ps1, QUICK_FIX_CONDA.txt - has said "PIN THE
# VERSION" since v0.30.7; this file was the one place that still left gdal
# unpinned, so `conda env create -f environment.yml` could resolve a
# DIFFERENT GDAL than the one actually tested. That is the exact class of
# drift that already turned a real bug in this codebase into an apparent
# GDAL regression once before (see core/config.py, GDAL_KNOWN_BAD_VERSIONS,
# and CHANGELOG_v0.30.7.md). It also matters specifically for the v0.30.13
# fix: core/metadata_handler.py's _verify_libxml2_abi() error message tells
# a user who hits the libxml2 ABI mismatch to run exactly this command to
# get GDAL and lxml from one consistent conda solve - that remediation is
# only as reliable as the pin below. See CHANGELOG_v0.30.14.md.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal=3.13.2   # PINNED (v0.30.14) - see DEPENDENCIES.txt "GDAL VERSION IS
                  # PINNED" and the note above. Do not loosen this back to an
                  # unpinned `gdal` without updating DEPENDENCIES.txt /
                  # requirements.txt / core/config.py's GDAL_TESTED_VERSION
                  # to match - they must all agree.
  - lxml          # ISO 19115 metadata XSD validation. Deliberately NOT
                  # pinned, so conda's solver picks whichever lxml build is
                  # mutually consistent with the pinned gdal above, in the
                  # SAME solve - pinning both risks forcing back together
                  # the exact mismatched pair the v0.30.13 ABI guard exists
                  # to catch.
  - pyproj        # optional: WKT2_2015 generation (GDAL osr is the fallback)
  - reportlab     # optional: PDF report export (HTML is the fallback)
  - pytest        # to run the unit tests / dev_tools\run_release_check_v0.30.18.py
  - pip           # required so the pip: section below has something to run in
  - pip:
      - ttkbootstrap==2.2.0
        # GUI theming (v0.30.18). NOT on conda-forge (checked 2026-08 -
        # anaconda.org/conda-forge/ttkbootstrap 404s), so it cannot join the
        # dependencies: list above - it has to come from pip, inside this
        # same `conda env create`. Pure Python/Tcl widget theming with no
        # native extension of its own, so - unlike lxml - there is no ABI to
        # accidentally mismatch against GDAL; it is pinned only so the
        # bootstyle strings in geopackage_creator_gui.py (tested against
        # exactly this release) keep resolving the same way.
