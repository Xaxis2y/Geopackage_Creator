[pytest]
# Pytest configuration for GeoPackage Creator tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add current directory to path
pythonpath = .

# Verbose output
addopts = -v --tb=short

# ---------------------------------------------------------------------------
# Markers (v0.30.10)
# ---------------------------------------------------------------------------
#
# `concurrency` marks every test that starts more than one thread and drives
# native code (GDAL/OGR, libxml2) from those threads.
#
# Why they are marked rather than fixed-and-forgotten. A thread-safety defect
# in a C library does not fail a test - it raises a Windows access violation
# that kills the pytest process outright. The v0.30.9 run died at test 4 of
# 305, so the other 301 tests produced no result at all and the log ended in a
# thread dump instead of a summary. Nothing was learned about the rest of the
# suite from a run that cost several minutes.
#
# Splitting the run into two processes means a native crash can only ever cost
# the marked subset:
#
#   pytest tests/ -v -m "not concurrency"   > pytest_main.log 2>&1
#   pytest tests/ -v -m concurrency         > pytest_concurrency.log 2>&1
#
# run_tests_v0.30.10.bat does exactly that and reports both exit codes; on
# Windows an access violation surfaces as exit code -1073741819 (0xC0000005).
#
# NOTE: the marked tests are deliberately NOT deselected by default. Silently
# skipping tests is how a crash-prone path stops being tested at all. A plain
# `pytest tests/` still runs everything, exactly as it did before.
markers =
    concurrency: spawns threads through native GDAL/OGR or libxml2 code; run in a separate process so a native crash cannot take the rest of the suite with it

# Coverage options (if using pytest-cov)
# addopts = -v --cov=geopackage_creator --cov-report=term-missing
