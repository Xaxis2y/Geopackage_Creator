[pytest]
# Pytest configuration for GeoPackage Creator tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add current directory to path
pythonpath = .

# Verbose output
addopts = -v --tb=short

# Coverage options (if using pytest-cov)
# addopts = -v --cov=geopackage_creator --cov-report=term-missing
